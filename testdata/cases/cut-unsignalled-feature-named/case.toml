description = "no commit carries a signal, and the authored changelog makes the change a feature: a named minor is staged without --force"
cites = ["AC-STG-001.18", "contract-release-cli#release-cut-bump"]
git = [
  ["init", "-q", "-b", "main"],
  ["commit", "-q", "--allow-empty", "-m", "Initial commit"],
  ["tag", "-a", "-m", "v1.8.0", "v1.8.0"],
  ["commit", "-q", "--allow-empty", "-m", "Add a --verbose flag"],
  ["init", "-q", "--bare", "-b", "main", ".git/origin.git"],
  ["remote", "add", "origin", ".git/origin.git"],
  ["push", "-q", "origin", "main", "--tags"],
  ["remote", "set-head", "origin", "main"],
]
args = ["cut", "minor", "--dry-run"]
exit_code = 0
artifacts = ["stdout.txt", "stderr.txt"]
