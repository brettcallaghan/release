description = "no commit carries a signal and the mechanical producer gives the non-conventional commit no kind, so the suggestion is none: cut halts even under --yes and asks for a named bump"
cites = ["AC-VER-005.20", "contract-release-cli#release-cut-bump"]
git = [
  ["init", "-q", "-b", "main"],
  ["commit", "-q", "--allow-empty", "-m", "Initial commit"],
  ["tag", "-a", "-m", "v1.8.0", "v1.8.0"],
  ["commit", "-q", "--allow-empty", "-m", "Tidy the help text"],
  ["init", "-q", "--bare", "-b", "main", ".git/origin.git"],
  ["remote", "add", "origin", ".git/origin.git"],
  ["push", "-q", "origin", "main", "--tags"],
  ["remote", "set-head", "origin", "main"],
]
args = ["cut", "--skip-notes", "--yes", "--dry-run"]
exit_code = 1
artifacts = ["stdout.txt", "stderr.txt"]
