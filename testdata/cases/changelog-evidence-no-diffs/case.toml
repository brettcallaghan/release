  ["add", "src/greet.txt"],
  ["commit", "-q", "--cleanup=verbatim", "-m", "feat(cli): greet the user (#21)\n\nGreets the user by name on start.\nAdds a greeting template.\nReads the name from the environment.\nFalls back to \"friend\"."],
