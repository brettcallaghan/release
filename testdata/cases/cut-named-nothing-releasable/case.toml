description = "the only commit is documentation, so every entry has a kind and the suggestion is none: a named bump is refused, saying nothing is releasable and naming --force"
cites = ["AC-STG-001.13", "contract-release-cli#release-cut-bump"]
git = [
  ["init", "-q", "-b", "main"],
  ["commit", "-q", "--allow-empty", "-m", "Initial commit"],
  ["tag", "-a", "-m", "v1.8.0", "v1.8.0"],
  ["commit", "-q", "--allow-empty", "-m", "docs: describe the flag"],
  ["init", "-q", "--bare", "-b", "main", ".git/origin.git"],
  ["remote", "add", "origin", ".git/origin.git"],
  ["push", "-q", "origin", "main", "--tags"],
  ["remote", "set-head", "origin", "main"],
]
args = ["cut", "patch", "--skip-notes", "--dry-run"]
exit_code = 1
artifacts = ["stdout.txt", "stderr.txt"]
