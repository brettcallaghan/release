description = "without --target the release line is the branch origin/HEAD points to, read locally: a later local commit not on origin/main is not counted"
cites = ["contract-release-cli#release-version-bump"]
git = [
  ["init", "-q", "-b", "main"],
  ["commit", "-q", "--allow-empty", "-m", "Initial commit"],
  ["tag", "v1.0.0"],
  ["commit", "-q", "--allow-empty", "-m", "fix: published fix"],
  ["update-ref", "refs/remotes/origin/main", "HEAD"],
  ["symbolic-ref", "refs/remotes/origin/HEAD", "refs/remotes/origin/main"],
  ["commit", "-q", "--allow-empty", "-m", "feat: local only, not yet pushed"],
]
args = ["version"]
exit_code = 0
artifacts = ["stdout.txt", "stderr.txt"]
