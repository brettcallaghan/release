name: release

# Publishes a GitHub release when a stage pull request merges.
#
# `release cut` stops at the pull request; tagging and publication are this
# workflow's (ADR-005). Everything runs in one workflow: a tag pushed with
# GITHUB_TOKEN triggers no other workflow, so an `on: push: tags` workflow
# would never fire.
#
# Re-running a failed run finishes a partial release (CDP-004): the tag step
# accepts a tag already on the merge commit, assets upload with --clobber, and
# the release stays a draft until every asset is attached (CDP-006).

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  # One run per stage branch; never cancel a publication midway.
  group: release-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

env:
  # Matches the `go` directive in go.mod. Bump both together.
  GO_VERSION: "1.24"
  STAGE_PREFIX: cut/
  TAG_PREFIX: v
  # An awk prelude setting v to the version a `## ` heading names (`## 1.2.0`,
  # `## [1.2.0] - date`, `## v1.2.0`), or "" when it names none. It mirrors
  # internal/changelogfile's headingVersion.
  SECTION_VERSION: >-
    /^## / {
    v = $2; sub(/^\[/, "", v); sub(/\]$/, "", v); sub(/^v/, "", v);
    if (v !~ /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)([-+].*)?$/) v = ""
    }

jobs:
  publish:
    name: tag, build and publish
    runs-on: ubuntu-latest
    # A stage branch from a fork never reaches a publication credential
    # (CDP-015). The prefix is a signal, not an authorization (RRP-034): the
    # verify step below checks the merged commit itself.
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'cut/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          # Full history and tags: the verify step reads the latest tag.
          fetch-depth: 0

      - name: Verify the release commit
        run: |
          set -euo pipefail
          version="${HEAD_REF#"$STAGE_PREFIX"}"
          tag="$TAG_PREFIX$version"
          failed=0
          fail() { echo "::error::$1"; failed=1; }

          # Plain MAJOR.MINOR.PATCH; prereleases are not published here.
          if ! printf '%s' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            fail "stage branch $HEAD_REF does not name a version"
          fi

          # The newest version section of CHANGELOG.md is the one cut wrote.
          # A level-2 heading that names no version (`## Unreleased`) is
          # preamble, as the changelog writer treats it.
          top=""
          if [ -f CHANGELOG.md ]; then
            top="$(awk "$SECTION_VERSION"' v != "" { print v; exit }' CHANGELOG.md)"
          fi
          if [ "$top" != "$version" ]; then
            fail "CHANGELOG.md's newest section is '${top:-none}', not $version"
          fi

          # The plugin manifest ships the same version as the stage; a release
          # is never tagged while it carries another.
          plugin_version="$(jq -r .version plugin/.claude-plugin/plugin.json)"
          if [ "$plugin_version" != "$version" ]; then
            fail "plugin/.claude-plugin/plugin.json's version is '$plugin_version', not $version"
          fi

          # A tag already on this commit is a re-run; anywhere else, a collision.
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            at="$(git rev-parse "$tag^{commit}")"
            if [ "$at" != "$MERGE_SHA" ]; then
              fail "tag $tag already exists at $at, not at the merge commit $MERGE_SHA"
            fi
          fi

          [ "$failed" -eq 0 ] || exit 1
          {
            echo "VERSION=$version"
            echo "TAG=$tag"
          } >> "$GITHUB_ENV"

      - name: Tag the merge commit
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already tags $MERGE_SHA"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $VERSION" "$MERGE_SHA"
          git push origin "refs/tags/$TAG"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      # The same six targets the cli workflow's cross-compile job builds on
      # every pull request, stamped with the tag.
      - name: Build every target
        env:
          CGO_ENABLED: "0"
        run: scripts/build-release.sh "$TAG" dist

      - name: The linux/amd64 binary reports the release version
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          tar -xzf "dist/release_${VERSION}_linux_amd64.tar.gz" -C "$dir"
          got="$("$dir/release" --version)"
          echo "$got"
          case "$got" in
            *"$TAG"*) ;;
            *) echo "::error::release --version printed '$got', expected $TAG"; exit 1 ;;
          esac

      - name: Extract the release notes
        run: |
          set -euo pipefail
          # The body of CHANGELOG.md's section for this version, without its
          # heading: everything up to the next `## ` heading, with no leading
          # or trailing blank lines.
          awk -v want="$VERSION" "$SECTION_VERSION"'
            /^## / { if (found) exit; if (v == want) { found = 1; next } }
            !found { next }
            /^[[:space:]]*$/ { if (started) blank++; next }
            { while (blank > 0) { print ""; blank-- }; started = 1; print }
          ' CHANGELOG.md > dist/notes.md
          cat dist/notes.md

      - name: Publish the release
        run: |
          set -euo pipefail
          expected="$(cd dist && ls -1 release_* SHA256SUMS | sort)"

          if gh release view "$TAG" --json isDraft --jq .isDraft > draft.txt 2>/dev/null; then
            if [ "$(cat draft.txt)" = false ]; then
              # Published already: never rewrite its assets. A rebuild has
              # fresh archive timestamps, so its checksums would differ.
              remote="$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)"
              if [ "$remote" != "$expected" ]; then
                echo "::error::$TAG is published but its assets differ from the expected set"
                diff <(echo "$expected") <(echo "$remote") || true
                exit 1
              fi
              echo "$TAG is already published with every asset"
              exit 0
            fi
          else
            gh release create "$TAG" --draft --verify-tag \
              --title "$TAG" --notes-file dist/notes.md
          fi

          gh release upload "$TAG" --clobber \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS

          # Latest only when this is the highest stable version tagged, so a
          # maintenance release or a late re-run never moves it backwards.
          tags="$(git tag -l "$TAG_PREFIX*" --sort=-v:refname)"
          highest="$(printf '%s\n' "$tags" | grep -E "^$TAG_PREFIX[0-9]+\.[0-9]+\.[0-9]+\$" || true)"
          highest="${highest%%$'\n'*}"
          latest=false
          [ "$highest" = "$TAG" ] && latest=true
          gh release edit "$TAG" --draft=false --latest="$latest"

      # The brettcallaghan marketplace (brettcallaghan/agent-plugins) serves
      # the plugin from release/v<major> (RRP-005), so that branch names the
      # latest published release of its major and moves only after the step
      # above has attached every asset. The first release of a major creates
      # it; once a later major ships, it stays on its major's last release,
      # where a maintenance line starts (RRP-006). It decides "latest" itself,
      # so a re-run that finds the release already published still moves it.
      # A plain push only fast-forwards: a branch that is not an ancestor
      # fails here, loudly.
      - name: Move release/v<major> to the release
        run: |
          set -euo pipefail
          major="${VERSION%%.*}"
          tags="$(git tag -l "$TAG_PREFIX$major.*" --sort=-v:refname)"
          highest="$(printf '%s\n' "$tags" | grep -E "^${TAG_PREFIX}${major}\.[0-9]+\.[0-9]+\$" || true)"
          highest="${highest%%$'\n'*}"
          if [ "$highest" != "$TAG" ]; then
            echo "$TAG is not the highest $major.x release ($highest); release/v$major stays"
            exit 0
          fi
          git push origin "$MERGE_SHA:refs/heads/release/v$major"

      # Which declared artifacts reached the release and which did not
      # (CDP-003), whatever step failed.
      - name: Summarise
        if: always()
        run: |
          {
            echo "### Release ${TAG:-unresolved}"
            echo
            if ! gh release view "${TAG:-none}" --json isDraft,url,assets > release.json 2>/dev/null; then
              echo "No release created."
              exit 0
            fi
            jq -r '"draft: \(.isDraft)  \(.url)"' release.json
            echo
            remote="$(jq -r '.assets[].name' release.json | sort)"
            expected="$( (cd dist 2>/dev/null && ls -1 release_* SHA256SUMS 2>/dev/null) | sort)"
            echo "| Asset | State |"
            echo "|---|---|"
            for name in $(printf '%s\n%s\n' "$expected" "$remote" | sort -u); do
              if printf '%s\n' "$remote" | grep -qxF "$name"; then
                echo "| $name | uploaded |"
              else
                echo "| $name | missing |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
