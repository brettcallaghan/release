name: cli

# The Go gates for the `release` binary, and the portability evidence only a
# real matrix can produce.
#
# No `paths:` filter: a required workflow that never triggers on a pull
# request leaves its check pending forever and blocks the merge.
#
# macOS minutes bill at 10x and Windows at 2x on a private repository, so the
# matrix runs only on a pull request that is ready for review, a merge to
# main, and manual dispatch. Draft pull requests are skipped by each job's
# `if`, not at the trigger: a skipped job still reports a check run.

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review is not in the default set; without it, taking a pull
    # request out of draft would not start the run the draft skipped.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches the `go` directive in go.mod. Bump both together.
  GO_VERSION: "1.24"

jobs:
  # testdata/cases/**/expected/ and testdata/help/ are one committed set of
  # bytes; this job holds all three operating systems to them.
  test:
    name: go test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      # Which platforms diverged is the whole diagnostic for a portability
      # failure, so one failing leg does not cancel the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Report tool versions
        run: go version

      # One platform only: .gitattributes pins LF, so every platform reads the
      # same bytes.
      - name: Formatting
        if: matrix.os == 'ubuntu-latest'
        run: scripts/format-check

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  coverage:
    name: coverage across unit, snapshot and end-to-end layers
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Measure coverage and verify the README is current
        run: scripts/coverage.sh --check

      - name: Publish the tables to the run summary
        if: always()
        run: cat build/coverage/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            build/coverage/summary.md
            build/coverage/coverage-func.txt
            build/coverage/coverage.html
            build/coverage/coverage.out
          if-no-files-found: warn

  # Every platform in the release matrix is built from one checkout on one
  # Linux runner, so a target that stops cross-compiling fails the pull
  # request that broke it rather than the release tag.
  cross-compile:
    name: cross-compile the release matrix
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      # The same script the release workflow publishes from, so the archives
      # and the stamped version are exercised on every pull request.
      - name: Build and archive every target
        run: scripts/build-release.sh v0.0.0-ci "$RUNNER_TEMP/dist"

  # The binary runs in an image holding busybox and nothing else: no Go
  # toolchain, no glibc, no package manager. A binary that acquired a dynamic
  # dependency fails here. `release` needs only `git` (and `gh` for
  # `release cut`) at run time.
  no-runtime:
    name: runs with no language runtime installed
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Build the static linux/amd64 binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/release" ./cmd/release

      - name: The binary is statically linked
        run: |
          set -euo pipefail
          description="$(file -b release)"
          echo "release: $description"
          # `file` rather than `ldd`, whose wording for a static binary varies
          # by distribution.
          case "$description" in
            *"statically linked"*) ;;
            *) echo "release is not statically linked; it will not run in a bare image"; exit 1 ;;
          esac

      - name: Run release in an image containing only busybox and the binary
        run: |
          set -euo pipefail
          # A bare invocation names no command, which the contract makes the
          # invalid-arguments status, 2. `|| status=$?` because set -e would
          # abort on the expected non-zero status.
          status=0
          docker run --rm -v "$PWD/release:/release:ro" busybox:latest /release || status=$?
          echo "release exited $status"
          if [ "$status" -ne 2 ]; then
            echo "expected the invalid-arguments status (2) from a bare invocation"
            exit 1
          fi
          docker run --rm -v "$PWD/release:/release:ro" busybox:latest /release --version
