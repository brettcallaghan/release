target = "main"

[changelog]
breaking_heading = "💥 Breaking changes"
groups = [
  { kind = "FEATURE", heading = "🚀 Features" },
  { kind = "FIX", heading = "🪲 Bugs" },
  { kind = "PERFORMANCE", heading = "Performance" },
  { kind = "REVERT", heading = "Reverts" },
]

[commands]
# The version is stamped at build time (internal/buildinfo); no manifest holds it.
propagate = "true"
validate = "go build ./... && go test ./..."
